<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Download STAR Daily Caregiver Log | North Star Solutions Tech</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">

<style>
:root{
    --navy:#101827;
    --navy-2:#172235;
    --cream:#fbf6ea;
    --cream-2:#fffaf0;
    --amber:#fac775;
    --orange:#f59f55;
    --sage:#7ea99a;
    --text:#252937;
    --muted:#667085;
    --line:rgba(16,24,39,.12);
    --shadow:0 22px 70px rgba(16,24,39,.16);
}

*{
    box-sizing:border-box;
}

body{
    min-height:100vh;
    margin:0;
    display:grid;
    place-items:center;
    padding:28px;
    font-family:'Inter',sans-serif;
    color:white;
    background:
        radial-gradient(circle at 22% 24%,rgba(143,64,237,.34),transparent 30%),
        radial-gradient(circle at 78% 18%,rgba(34,204,222,.28),transparent 28%),
        radial-gradient(circle at 54% 88%,rgba(245,159,85,.22),transparent 34%),
        linear-gradient(140deg,#02040a 0%,#091225 45%,#10223c 100%);
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.42;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.82) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(34,204,222,.72) 1px,transparent 1.7px),
        radial-gradient(circle,rgba(143,64,237,.7) 1px,transparent 1.8px);
    background-size:82px 82px,136px 136px,188px 188px;
    background-position:0 0,34px 22px,80px 44px;
}

.download-page{
    position:relative;
    z-index:1;
    width:min(980px,100%);
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(220px,.42fr);
    gap:34px;
    align-items:center;
    padding:42px;
    border-radius:26px;
    background:
        radial-gradient(circle at 84% 18%,rgba(34,204,222,.22),transparent 30%),
        radial-gradient(circle at 14% 84%,rgba(143,64,237,.22),transparent 34%),
        rgba(8,18,37,.86);
    border:1px solid rgba(34,204,222,.24);
    box-shadow:var(--shadow),0 0 42px rgba(34,204,222,.12);
    overflow:hidden;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:38px;
    font-weight:800;
}

.brand img{
    width:48px;
    height:48px;
    border-radius:14px;
    object-fit:cover;
    box-shadow:0 0 28px rgba(62,206,223,.34);
}

h1{
    margin:0 0 16px;
    font-size:clamp(2.4rem,6vw,4.7rem);
    line-height:1.02;
    letter-spacing:0;
}

p{
    margin:0;
    color:rgba(232,247,255,.76);
    font-size:clamp(1rem,2vw,1.2rem);
    line-height:1.65;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin:30px 0 18px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    border-radius:999px;
    padding:14px 22px;
    color:var(--navy);
    background:linear-gradient(135deg,var(--amber),#ffb36e);
    text-decoration:none;
    font-weight:800;
    box-shadow:0 14px 28px rgba(245,159,85,.28);
    transition:transform .25s ease,box-shadow .25s ease,filter .25s ease;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 38px rgba(245,159,85,.34);
    filter:saturate(1.08);
}

.btn.secondary{
    color:white;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:none;
}

.instruction{
    max-width:680px;
    color:rgba(232,247,255,.68);
    font-size:.96rem;
}

.session-note{
    min-height:24px;
    margin-top:14px;
    color:rgba(250,199,117,.86);
    font-size:.86rem;
    font-weight:700;
}

.cover{
    width:min(260px,100%);
    justify-self:center;
    border-radius:10px;
    transform:rotate(-2deg);
    box-shadow:0 26px 58px rgba(0,0,0,.36),10px 10px 0 rgba(242,238,224,.82);
}

@media (max-width:760px){
    body{
        padding:18px;
    }

    .download-page{
        grid-template-columns:1fr;
        padding:28px;
    }

    .brand{
        margin-bottom:28px;
    }

    .actions,
    .btn{
        width:100%;
    }
}
</style>
</head>

<body>
<main class="download-page">
    <section>
        <div class="brand">
            <img src="../../nsst-logo.jpg" alt="North Star Solutions Tech logo">
            <span>North Star Solutions Tech</span>
        </div>

        <h1>Thank You for Your Purchase!</h1>
        <p>Your STAR Daily Caregiver Log is ready.</p>

        <div class="actions">
            <a class="btn" id="download-link" href="STAR_CAREGIVER_LOG_PDF_URL">Download STAR Daily Caregiver Log PDF</a>
            <a class="btn secondary" href="../../">Return to North Star Solutions Tech</a>
        </div>

        <p class="instruction">Save the PDF to your device, print pages as needed, or import it into a PDF annotation app such as Goodnotes or Notability.</p>
        <p class="session-note" id="session-note" aria-live="polite"></p>
    </section>

    <img class="cover" src="../../caregiverlog1800.jpeg" alt="STAR Daily Caregiver Log cover">
</main>

<script>
const STAR_CAREGIVER_LOG_PDF_URL = "STAR_CAREGIVER_LOG_PDF_URL";
const downloadLink = document.querySelector("#download-link");
const sessionNote = document.querySelector("#session-note");
const params = new URLSearchParams(window.location.search);
const checkoutSessionId = params.get("session_id") || params.get("checkout_session_id");

downloadLink.href = STAR_CAREGIVER_LOG_PDF_URL;

if (checkoutSessionId) {
    window.STAR_CAREGIVER_LOG_CHECKOUT_SESSION_ID = checkoutSessionId;
    sessionNote.textContent = "Checkout session received. Payment verification should be handled server-side before this link is finalized.";
}
</script>
</body>
</html>
